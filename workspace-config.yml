# ไม่ใช่ secret (แค่ workspace identifier) — commit เข้า repo ได้ปกติเหมือน endpoint-targets.yml
#
# หมายเหตุ: นี่คือ workspace ของ fabric_items/ (item หลัก) เท่านั้น — endpoint item
# (lh_endpoint_lab ฯลฯ) มี config แยกของตัวเองอยู่แล้วที่ endpoint-targets.yml

